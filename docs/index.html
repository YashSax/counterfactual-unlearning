<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machine Unlearning: Qwen3-8B</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg:#fbfbfd; --panel:#f2f3f6; --line:#dde0e7; --ink:#1a1c22;
    --dim:#676c7a; --accent:#2f5fd0; --warn:#8a6100;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  html { -webkit-text-size-adjust:100%; }
  @supports (height:100dvh) { html,body { height:100dvh; } }
  body {
    background:var(--bg); color:var(--ink); display:flex; flex-direction:column;
    font:15px/1.6 ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
  }
  header { border-bottom:1px solid var(--line); padding:16px 22px; flex-shrink:0; }
  h1 { font-size:17px; margin:0 0 6px; font-weight:600; letter-spacing:-.01em; }
  .sub { color:var(--dim); font-size:13px; max-width:78ch; }
  .sub b { color:var(--ink); font-weight:600; }
  .links { margin-top:10px; font-size:13px; }
  .links a { color:var(--accent); text-decoration:none; margin-right:16px; }
  .links a:hover { text-decoration:underline; }
  main { flex:1; min-height:0; display:flex; }
  iframe { flex:1; width:100%; border:0; background:var(--bg); }
  .fallback { padding:22px; color:var(--dim); font-size:13px; }
  .fallback a { color:var(--accent); }
  summary { display:none; }

  /* On a phone the header was eating most of the screen and leaving the demo
     a strip. Collapse the explanation behind a tap, keep the links
     visible, and give the frame the rest. */
  @media (max-width:820px){
    header { padding:10px 14px; }
    h1 { font-size:14px; line-height:1.3; margin-bottom:5px; }
    .sub { font-size:12px; line-height:1.45; }
    summary {
      display:block; list-style:none; cursor:pointer; color:var(--accent);
      font-size:12.5px; padding:5px 0;
    }
    summary::-webkit-details-marker { display:none; }
    summary::after { content:" ▾"; }
    details[open] summary::after { content:" ▴"; }
    details[open] summary { margin-bottom:3px; }
    .links { display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:6px; font-size:12.5px; }
    .links a { margin-right:0; padding:5px 0; }
    main { min-height:64dvh; }
  }
</style>

<header>
  <h1>Machine Unlearning: Qwen3-8B</h1>
  <div class="sub">
    <details id="more" open>
      <summary>what this is</summary>
      Model on the left is an untouched Qwen3-8B; model on the right is the
      trained model with RMU + SFT + GRPO.
    </details>
  </div>
  <div class="links">
    <a href="https://github.com/YashSax/counterfactual-unlearning" target="_blank" rel="noopener">Source</a>
    <a href="https://saxenaya.substack.com/p/forgetting-the-911-attacks-on-memory?r=92ea1j&amp;utm_campaign=post&amp;utm_medium=web&amp;showWelcomeOnShare=true" target="_blank" rel="noopener">Writeup</a>
    <a href="https://www.linkedin.com/in/saxenaya/" target="_blank" rel="noopener">LinkedIn</a>
    <a href="https://x.com/saxenaya1" target="_blank" rel="noopener">Twitter</a>
  </div>
</header>

<main>
  <iframe id="demo"
          src="https://accordance--npo-911-chat-chat-web.modal.run"
          title="Two-pane model comparison"
          loading="lazy"></iframe>
</main>

<script>
// The explanation is open on a desktop (its summary is hidden by CSS) and
// closed on a phone, where it would otherwise leave the demo a strip of
// screen.
const more = document.getElementById('more');
const narrow = window.matchMedia('(max-width: 820px)');
const sync = () => { more.open = !narrow.matches; };
narrow.addEventListener('change', sync);
sync();

// The demo is a GPU-backed endpoint with a cold start; if it does not paint,
// say so rather than leaving an empty frame.
const fr = document.getElementById('demo');
let painted = false;
fr.addEventListener('load', () => { painted = true; });
setTimeout(() => {
  if (painted) return;
  const m = document.querySelector('main');
  m.innerHTML = '<div class="fallback">The demo endpoint did not load — it is '
    + 'GPU-backed and cold starts take a minute or two. '
    + '<a href="https://accordance--npo-911-chat-chat-web.modal.run" '
    + 'target="_blank" rel="noopener">Open it directly</a>.</div>';
}, 150000);
</script>
</html>
