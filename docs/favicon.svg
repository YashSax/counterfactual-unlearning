<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- One office tower: grey body, yellow lit windows, a couple left dark so
       it reads as a building rather than a grid. Mid grey holds up on both
       light and dark tab strips, so no colour-scheme swap is needed. -->
  <rect x="7" y="3" width="18" height="28" rx="1" fill="#6b7280"/>
  <rect x="7" y="3" width="18" height="2.5" rx="1" fill="#4b5563"/>
  <g fill="#facc15">
    <rect x="9.5" y="8" width="3.5" height="3"/>
    <rect x="14.25" y="8" width="3.5" height="3"/>
    <rect x="19" y="8" width="3.5" height="3"/>
    <rect x="9.5" y="13" width="3.5" height="3"/>
    <rect x="19" y="13" width="3.5" height="3"/>
    <rect x="14.25" y="18" width="3.5" height="3"/>
    <rect x="19" y="18" width="3.5" height="3"/>
    <rect x="9.5" y="23" width="3.5" height="3"/>
    <rect x="14.25" y="23" width="3.5" height="3"/>
  </g>
  <g fill="#4b5563">
    <rect x="14.25" y="13" width="3.5" height="3"/>
    <rect x="9.5" y="18" width="3.5" height="3"/>
    <rect x="19" y="23" width="3.5" height="3"/>
  </g>
</svg>
